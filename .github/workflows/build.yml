name: build

# Builds the Rust `wina` CLI and the Tauri desktop app for macOS + Windows.
# The GUI ships `wina` as a Tauri sidecar (externalBin), so each platform
# builds wina first and drops it into src-tauri/binaries/wina-<target-triple>
# before bundling.

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# Needed so the release step can create/update a GitHub Release on tag pushes.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            viewer/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build wina (Rust core + CLI)
        run: cargo build --release -p wina --manifest-path rust/Cargo.toml

      - name: Stage wina as the Tauri sidecar
        shell: bash
        run: |
          mkdir -p viewer/src-tauri/binaries
          cp "rust/target/release/wina${{ matrix.ext }}" "viewer/src-tauri/binaries/wina-${{ matrix.triple }}${{ matrix.ext }}"

      - name: Install viewer deps
        working-directory: viewer
        run: npm ci

      - name: Build Tauri app
        working-directory: viewer
        run: npm run tauri build

      - name: Upload wina CLI
        uses: actions/upload-artifact@v4
        with:
          name: wina-${{ matrix.triple }}
          path: rust/target/release/wina${{ matrix.ext }}

      - name: Upload Tauri bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-analysis-gui-${{ matrix.triple }}
          path: |
            viewer/src-tauri/target/release/bundle/**
          if-no-files-found: warn

      # On a tag push (e.g. `beta`, `v0.1.0`), publish the built installers +
      # the wina CLI to a GitHub Release. Each platform job appends its own
      # assets to the same release; unmatched globs are skipped so a runner only
      # uploads what it produced.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          fail_on_unmatched_patterns: false
          files: |
            rust/target/release/wina${{ matrix.ext }}
            viewer/src-tauri/target/release/bundle/dmg/*.dmg
            viewer/src-tauri/target/release/bundle/msi/*.msi
            viewer/src-tauri/target/release/bundle/nsis/*-setup.exe
