name: build

# Builds the Tauri desktop app for macOS + Windows. The GUI links wina-core
# directly (no sidecar), so it's a single self-contained binary:
#   - macOS  -> a .dmg
#   - Windows -> the raw portable .exe (no installer; --no-bundle)

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# Needed so the release step can create/update a GitHub Release on tag pushes.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundleArgs: "--bundles dmg"
          - os: windows-latest
            bundleArgs: "--no-bundle"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: viewer/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install viewer deps
        working-directory: viewer
        run: npm ci

      - name: Build Tauri app
        working-directory: viewer
        run: npm run tauri build -- ${{ matrix.bundleArgs }}

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "viewer/src-tauri/target/release/windows-analysis-gui.exe" "dist/Windows-Analysis.exe"
          else
            cp viewer/src-tauri/target/release/bundle/dmg/*.dmg dist/ || true
          fi
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-analysis-${{ matrix.os }}
          path: dist/*
          if-no-files-found: warn

      # On a tag push (e.g. `beta`, `v0.1.0`), publish the app to a GitHub
      # Release. Each platform job appends its own asset to the same release.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          fail_on_unmatched_patterns: false
          files: dist/*
