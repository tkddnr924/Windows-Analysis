[workspace]
resolver = "2"
members = ["core", "cli"]

[workspace.package]
version = "0.1.0-beta"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Win11 SRUM(SRUDB.dat)의 신형 ESE 페이지 태그 플래그를 처리하는 다운스트림
# 패치(vendor/libesedb-sys/patches/fix-win11_page_tag_flags.patch) 적용본.
[patch.crates-io]
libesedb-sys = { path = "vendor/libesedb-sys" }
