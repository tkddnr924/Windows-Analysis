[package]
name = "windows-analysis-gui"
version = "1.3.9"
edition = "2021"
description = "Windows-Analysis Tauri viewer"
default-run = "windows-analysis-gui"

[[bin]]
name = "windows-analysis-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
wina-core = { path = "../../rust/core" }
# notatin (pulled in via wina-core) targets nom 7; force it here too — this
# crate has its own lockfile, separate from the rust/ workspace pin.
nom = "=7.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
