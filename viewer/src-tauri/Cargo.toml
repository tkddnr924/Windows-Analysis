[package]
name = "windows-analysis-gui"
version = "0.1.0-beta"
edition = "2021"
description = "Windows-Analysis Tauri viewer"
default-run = "windows-analysis-gui"

[[bin]]
name = "windows-analysis-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
